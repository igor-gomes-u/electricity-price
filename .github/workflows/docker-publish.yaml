name: CD – Build, Scan & Publish DEV

on:
  push:
    branches:
      - main
    paths:
      - "application/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yaml"
  workflow_dispatch: {}

env:
  IMAGE_REPO: ghcr.io/igor-gomes-u/electricity-price
  GITOPS_REPO: igor-gomes-u/electricity-price-gitops

permissions:
  contents: read
  actions: write
  packages: write
  security-events: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx (multi-arch)
        uses: docker/setup-buildx-action@v3

      - name: Set tags
        id: meta
        run: |
          echo "DEV_TAG=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & publish multi-arch (amd64, arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.DEV_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Expose image digest (for promotion/use later)
        run: |
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
          printf "%s" "${{ steps.build.outputs.digest }}" > image-digest.txt
          {
            echo "## Build outputs"
            echo ""
            echo "- Tag: \`${{ steps.meta.outputs.DEV_TAG }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 7

      - name: Smoke test published container
        shell: bash
        run: |
          set -Eeuo pipefail

          CONTAINER_NAME="electricity-price-smoke"
          IMAGE_REFERENCE="${IMAGE_REPO}@${{ steps.build.outputs.digest }}"

          cleanup() {
            EXIT_CODE=$?
            trap - EXIT

            if [[ "${EXIT_CODE}" -ne 0 ]]; then
              echo "Smoke test failed. Container logs:"
              docker logs "${CONTAINER_NAME}" 2>/dev/null || true
            fi

            docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
            exit "${EXIT_CODE}"
          }

          trap cleanup EXIT

          echo "Starting ${IMAGE_REFERENCE}"

          docker run \
            --detach \
            --name "${CONTAINER_NAME}" \
            --platform linux/amd64 \
            --health-interval 2s \
            --health-start-period 20s \
            --health-retries 10 \
            --publish 127.0.0.1:18000:8000 \
            "${IMAGE_REFERENCE}"

          for ATTEMPT in {1..60}; do
            HEALTH_STATUS=$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
              "${CONTAINER_NAME}")

            echo "Health check attempt ${ATTEMPT}: ${HEALTH_STATUS}"

            if [[ "${HEALTH_STATUS}" == "healthy" ]]; then
              break
            fi

            if [[ "${HEALTH_STATUS}" == "unhealthy" ]]; then
              echo "Container reported an unhealthy status."
              exit 1
            fi

            if [[ "${ATTEMPT}" -eq 30 ]]; then
              echo "Container did not become healthy within the expected time."
              exit 1
            fi

            sleep 2
          done

          curl --fail --silent --show-error \
            http://127.0.0.1:18000/healthz

          METRICS_RESPONSE=$(curl --fail --silent --show-error \
            http://127.0.0.1:18000/metrics)

          grep --quiet "app_http_requests_total" <<< "${METRICS_RESPONSE}"

          curl --fail --silent --show-error \
            --output /dev/null \
            http://127.0.0.1:18000/

          echo "Container smoke test passed."

      - name: Cache Trivy DB
        if: always()
        uses: actions/cache@v5
        with:
          path: .trivycache
          key: trivy-db-${{ runner.os }}-v1

      - name: Trivy image scan (HIGH/CRITICAL, blocking)
        id: trivy_block
        continue-on-error: true
        run: |
          mkdir -p .trivycache
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e TRIVY_CACHE_DIR=/work/.trivycache \
            -v "${PWD}:/work" -w /work \
            aquasec/trivy:0.59.1 \
            image \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 1 \
            "${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}"

      - name: Trivy image scan (SARIF report)
        if: always()
        run: |
          mkdir -p .trivycache
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e TRIVY_CACHE_DIR=/work/.trivycache \
            -v "${PWD}:/work" -w /work \
            aquasec/trivy:0.59.1 \
            image \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-image.sarif \
            --exit-code 0 \
            "${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}"

      - name: Validate SARIF
        if: always()
        id: sarif_meta
        run: |
          if [ ! -s trivy-image.sarif ]; then
            echo "HAS_SARIF=false" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_SARIF=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Trivy SARIF artifact
        if: always() && steps.sarif_meta.outputs.HAS_SARIF == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          retention-days: 14

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && steps.sarif_meta.outputs.HAS_SARIF == 'true' && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

      - name: Create SBOM directory
        if: always()
        run: mkdir -p sbom

      - name: Generate SBOM (CycloneDX) for image
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .trivycache sbom
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e TRIVY_CACHE_DIR=/work/.trivycache \
            -v "${PWD}:/work" -w /work \
            aquasec/trivy:0.59.1 \
            image \
            --ignore-unfixed \
            --format cyclonedx \
            --output sbom/sbom.cdx.json \
            --exit-code 0 \
            "${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}"
        
      - name: Validate SBOM
        if: always()
        id: sbom_meta
        run: |
          if [ ! -s sbom/sbom.cdx.json ]; then
            echo "SBOM missing or empty; skipping upload."
            echo "HAS_SBOM=false" >> "$GITHUB_OUTPUT"
          else
            echo "SBOM found; will be uploaded."
            echo "HAS_SBOM=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SBOM artifact
        if: always() && steps.sbom_meta.outputs.HAS_SBOM == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom/sbom.cdx.json
          retention-days: 14

      # GitOps is driven through repository_dispatch: update DEV and trigger the promotion flow with the same tag and digest (no rebuilds in GitOps)
      - name: Dispatch dev-update event to GitOps
        if: steps.trivy_block.outcome == 'success'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GH_PAT }}
          repository: ${{ env.GITOPS_REPO }}
          event-type: update-dev
          client-payload: >-
            {
              "tag": "${{ steps.meta.outputs.DEV_TAG }}",
              "digest": "${{ steps.build.outputs.digest }}"
            }

      # STAGING promotion is delegated to the dedicated staging workflow.
      - name: Trigger STAGING promotion workflow
        if: steps.trivy_block.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run promote-staging.yaml \
            --ref main \
            -f sha="${{ github.sha }}" \
            -f tag="${{ steps.meta.outputs.DEV_TAG }}" \
            -f digest="${{ steps.build.outputs.digest }}"

      - name: Info
        if: steps.trivy_block.outcome == 'success'
        run: |
          echo "Sent update-dev event to GitOps and triggered STAGING promotion workflow:"
          echo "  Tag:    ${{ steps.meta.outputs.DEV_TAG }}"
          echo "  Digest: ${{ steps.build.outputs.digest }}"
        
      - name: Enforce vulnerability gate (fail if blocking scan failed)
        if: always()
        run: |
          if [ "${{ steps.trivy_block.outcome }}" != "success" ]; then
            echo "Trivy blocking scan failed (HIGH/CRITICAL found). Failing pipeline after reports."
            exit 1
          fi

